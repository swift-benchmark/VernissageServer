name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    # Linux, not macOS: the CWE-90 plant added Perfect-LDAP, whose transitive
    # dependency Perfect-ICONV does not compile with the macOS toolchain
    # ("cannot find 'memset' in scope"). These are Linux server packages, and
    # swift:6.2-noble is what the project's own Dockerfile builds with.
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # SwiftGD wraps libgd; SwiftExif wraps libexif and libiptcdata. On macOS
      # these came from brew; the apt equivalents are the -dev packages. Install
      # before init: this step only downloads, there is nothing to trace.
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y libgd-dev libexif-dev libiptcdata0-dev libssl-dev libldap2-dev libsasl2-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      - name: Build
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"
