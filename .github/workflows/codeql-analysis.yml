name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # SwiftGD wraps libgd; SwiftExif wraps libexif and libiptcdata - both
      # declare these as .brew() providers in their manifests. This has to run
      # before the CodeQL init, because the tracing environment it sets up makes
      # brew resolve as x86_64 and refuse the ARM prefix
      # ("Cannot install under Rosetta 2").
      - name: Install native dependencies
        run: brew install gd libexif libiptcdata

      # The CWE-90 plant added Perfect-LDAP, which drags in Perfect-ICONV. That
      # package guards its imports with `#if os(Linux) import ICONVApiLinux
      # #else import ICONVApi #endif`: on Linux the C shim pulls Glibc in with
      # it, on macOS nothing brings Darwin, so memset/memcpy are not in scope and
      # the build dies. Resolve first (download only, before the tracer) and add
      # the missing import to the checkout.
      - name: Resolve dependencies and patch Perfect-ICONV
        run: |
          set -euo pipefail
          swift package resolve
          f=.build/checkouts/Perfect-ICONV/Sources/PerfectICONV/PerfectICONV.swift
          if ! grep -q '^import Darwin$' "$f"; then
            printf 'import Darwin\n' | cat - "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          fi
          head -3 "$f"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      # Homebrew installs arm64 libraries, but the traced build defaults to
      # x86_64, so linking against libgd/libexif fails with
      # "symbol(s) not found for architecture x86_64". Pin arm64 across the
      # Swift, C and link steps together - pinning only Swift leaves the C
      # targets on the other arch and breaks the link just the same.
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH"
          swift build \
            -Xswiftc -target -Xswiftc arm64-apple-macosx15.0 \
            -Xcc -arch -Xcc arm64 \
            -Xlinker -arch -Xlinker arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"